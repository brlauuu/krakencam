<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kraken Cam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --sea: #04121f;
    --foam: #e8f6f5;
    --gold: #f2c14e;
    --glass: rgba(4, 18, 31, 0.62);
    --line: rgba(232, 246, 245, 0.25);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--foam); overflow: hidden;
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none;
    user-select: none; -webkit-user-select: none; }
  [hidden] { display: none !important; }
  #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  button { font: inherit; color: inherit; background: var(--glass); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 16px; cursor: pointer; backdrop-filter: blur(6px); }
  button:active { transform: scale(0.95); }

  #hud { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 0; right: 0;
    text-align: center; pointer-events: none; text-shadow: 0 1px 4px #000; }
  #scene-name { font-weight: 700; font-size: 20px; letter-spacing: 0.04em; color: var(--gold); }
  #chars { display: flex; justify-content: center; gap: 10px; margin-top: 4px; font-size: 13px; opacity: 0.9; }
  #hud.flash #scene-name { animation: pop 0.5s ease-out; }
  @keyframes pop { from { transform: scale(1.35); } to { transform: scale(1); } }

  #bar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 18px);
    display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 16px; }
  #bar .round { width: 48px; height: 48px; padding: 0; display: grid; place-items: center; font-size: 20px; }
  #shutter { width: 76px; height: 76px; padding: 0; border: 4px solid var(--foam);
    background: radial-gradient(circle, var(--foam) 58%, transparent 60%); }

  #lock.on { background: var(--gold); color: var(--sea); }

  #split { position: fixed; top: 0; bottom: 0; width: 44px; margin-left: -22px; cursor: ew-resize; }
  #split::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 2px;
    background: repeating-linear-gradient(var(--gold) 0 12px, transparent 12px 20px); opacity: 0.8; }
  #split::after { content: "⇆"; position: absolute; left: 4px; top: 50%; width: 36px; height: 36px;
    margin-top: -18px; border-radius: 50%; background: var(--gold); color: var(--sea);
    display: grid; place-items: center; font-weight: 700; }

  #plate-hint { position: fixed; top: calc(env(safe-area-inset-top) + 80px); left: 50%;
    transform: translateX(-50%); white-space: nowrap; background: var(--gold); color: var(--sea); }

  #calib { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 80px);
    padding: 14px 16px; border-radius: 16px; background: var(--glass); border: 1px solid var(--gold);
    text-align: center; backdrop-filter: blur(6px); }
  #calib p { margin: 0 0 10px; font-weight: 600; }
  #calib .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 80%; overflow: auto;
    background: rgba(4, 18, 31, 0.92); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); backdrop-filter: blur(10px); touch-action: pan-y; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; color: var(--gold); display: flex; justify-content: space-between; align-items: center; }
  .sheet label { display: block; margin: 12px 0 4px; font-size: 14px; }
  .sheet small { display: block; opacity: 0.65; font-size: 12px; }
  .sheet input[type=range] { width: 100%; accent-color: var(--gold); }
  .sheet select { font: inherit; width: 100%; padding: 8px; border-radius: 10px; background: var(--sea);
    color: var(--foam); border: 1px solid var(--line); }
  .sheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .check { display: flex !important; gap: 8px; align-items: center; }

  #photo { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 16px; }
  #photo img { max-width: 100%; max-height: 75%; border-radius: 12px; box-shadow: 0 0 0 2px var(--gold); }
  #photo .row { display: flex; gap: 10px; }
  #photo-share { background: var(--gold); color: var(--sea); font-weight: 700; border: 0; }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash 0.35s ease-out; }
  @keyframes flash { from { opacity: 0.8; } to { opacity: 0; } }

  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 112px);
    text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.25s;
    color: var(--foam); text-shadow: 0 1px 4px #000; font-weight: 600; }
  #toast.show { opacity: 1; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 30%, #0b3a52, var(--sea) 70%); }
  #start h1 { margin: 0; font-size: 40px; color: var(--gold); letter-spacing: 0.04em; }
  #start p { margin: 0; max-width: 340px; opacity: 0.85; }
  #start-btn { font-size: 20px; padding: 14px 28px; background: var(--gold); color: var(--sea); font-weight: 700; border: 0; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<div id="split" hidden></div>

<div id="hud">
  <div id="scene-name"></div>
  <div id="chars"><span id="char-left"></span><span>·</span><span id="char-right"></span></div>
</div>
<button id="plate-hint" hidden>Tripod? Tap to capture background</button>

<div id="calib" hidden>
  <p id="calib-text"></p>
  <div class="row">
    <button id="calib-same">Same green — split left/right</button>
    <button id="calib-cancel">Cancel</button>
  </div>
</div>

<div id="bar">
  <button class="round" id="open-settings" aria-label="Settings">⚙︎</button>
  <button class="round" id="prev" aria-label="Previous effect">◀</button>
  <button id="shutter" aria-label="Take photo"></button>
  <button class="round" id="next" aria-label="Next effect">▶</button>
  <button class="round" id="calibrate" aria-label="Calibrate suits">◎</button>
</div>

<div id="toast"></div>
<div id="flash"></div>

<div class="sheet" id="settings" hidden>
  <h2>Settings <button id="close-settings">Done</button></h2>

  <label for="tol">Green tolerance <small>Raise if bits of the suit show through; lower if other stuff turns into effect</small></label>
  <input type="range" id="tol" min="0.02" max="0.3" step="0.005">
  <label for="soft">Edge softness</label>
  <input type="range" id="soft" min="0.005" max="0.2" step="0.005">
  <label for="spill">Green spill cleanup <small>Removes the green glow on skin/hands near the suit</small></label>
  <input type="range" id="spill" min="0" max="1" step="0.05">

  <label for="mode">Who is who</label>
  <select id="mode">
    <option value="0">By suit colour (different greens)</option>
    <option value="1">Left / right split (same green)</option>
  </select>

  <label class="check"><input type="checkbox" id="show-mask"> Show mask (red = character 1, blue = character 2)</label>
  <label class="check"><input type="checkbox" id="hd"> High resolution (sharper photos, slower)</label>

  <div class="row">
    <button id="calibrate-2" onclick="document.getElementById('calibrate').click()">◎ Re-calibrate suits</button>
    <button id="swap">⇄ Swap characters</button>
    <button id="lock">🔒 Lock exposure</button>
    <button id="flip">↺ Flip camera</button>
    <button id="plate">Capture background (tripod)</button>
    <button id="reset">Reset sliders</button>
  </div>
</div>

<div id="photo" hidden>
  <img id="photo-img" alt="Captured photo">
  <div class="row">
    <button id="photo-share">Share</button>
    <button id="photo-save">Save</button>
    <button id="photo-close">Back</button>
  </div>
</div>

<div id="start">
  <h1>Kraken Cam</h1>
  <p>Point the camera at the green suits. Swipe or use ◀ ▶ to change effects, ◎ to calibrate, and the big button to take a photo.</p>
  <button id="start-btn">Start camera</button>
  <p id="start-msg"></p>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
